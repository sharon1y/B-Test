<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ff"><title>My Day 플래너</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#28243b;background:#f7f5ff}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:24px 18px 110px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:8px 0}p{color:#77738a}.panel{background:white;border-radius:24px;padding:18px;margin:16px 0;box-shadow:0 5px 24px #403a6910}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:0;border-radius:13px;padding:11px 2px;background:transparent;color:#555;cursor:pointer}.day.active{background:#7661d5;color:white}.day small{display:block;margin-bottom:5px}.nav{display:flex;gap:8px}.nav button,.soft{background:#eeeafd;border:0;border-radius:12px;padding:10px 14px;color:#6552b6;cursor:pointer}.task{display:flex;align-items:center;gap:12px;padding:14px;margin:9px 0;background:white;border-radius:17px;border-left:6px solid #b8a5f2;box-shadow:0 3px 12px #403a690c}.task.done{opacity:.55}.task.done .name{text-decoration:line-through}.time{width:55px;flex-shrink:0;font-size:13px;color:#777}.info{flex:1;min-width:0}.name{font-weight:650;overflow-wrap:anywhere}.meta{font-size:12px;color:#888;margin-top:4px}.task input{width:21px;height:21px;accent-color:#7661d5}.edit{background:transparent;border:0;font-size:20px;color:#89819e;cursor:pointer}.fab{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:#7661d5;color:white;padding:16px 30px;font-size:17px;box-shadow:0 7px 25px #7661d555;cursor:pointer}dialog{border:0;border-radius:24px;padding:24px;width:min(92vw,440px);box-shadow:0 20px 80px #27213c55}dialog::backdrop{background:#201a3480}label{display:block;margin:14px 0 5px;font-weight:600;font-size:13px}input:not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #ded9ec;border-radius:12px;font:inherit;background:white}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}.primary{background:#7661d5;color:white;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}.danger{color:#bf4662;background:#ffebef;border:0;border-radius:12px;padding:12px;cursor:pointer}.empty{text-align:center;padding:45px 10px;color:#928ca5}.sub{font-size:13px;margin:3px 0}.count{font-size:14px;color:#776a9e}.topline{display:flex;align-items:center;justify-content:space-between}button{font:inherit}#backup{display:none}</style></head><body><main><header><div><p class="sub">MY DAY ✨</p><h1 id="heading"></h1><div class="count" id="count"></div></div><div class="nav"><button id="prev" aria-label="이전 날짜">‹</button><button id="today">오늘</button><button id="next" aria-label="다음 날짜">›</button></div></header><section class="panel"><div class="week" id="week"></div></section><div class="topline"><h2>오늘의 타임라인</h2><button class="soft" id="export">백업</button></div><div id="tasks"></div><button class="soft" id="import">백업 불러오기</button><input id="backup" type="file" accept="application/json"><p class="sub">이 브라우저에 자동 저장돼요. 브라우저 데이터 삭제 시 사라질 수 있으니 가끔 백업해 주세요.</p></main><button class="fab" id="add">＋ 할 일 추가</button><dialog id="editor"><form id="form"><h2 id="formtitle">할 일 추가</h2><label for="title">할 일</label><input id="title" maxlength="120" required placeholder="무엇을 해야 하나요?"><label for="date">날짜</label><input id="date" type="date" required><label for="time">시작 시간 (선택)</label><input id="time" type="time"><label for="category">카테고리</label><select id="category"><option>개인</option><option>학교</option><option>약속</option><option>생활</option><option>기타</option></select><label for="repeat">반복</label><select id="repeat"><option value="none">반복 안 함</option><option value="daily">매일</option><option value="weekly">매주</option></select><div class="actions"><button type="button" class="danger" id="delete" hidden>삭제</button><button type="button" class="soft" id="cancel">취소</button><button class="primary" type="submit">저장</button></div></form></dialog><script>
const KEY='myday-planner-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{tasks:[],done:{}}}catch{data={tasks:[],done:{}}}if(!Array.isArray(data.tasks))data.tasks=[];if(!data.done||typeof data.done!=='object')data.done={};const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},move=(s,n)=>{let d=parse(s);d.setDate(d.getDate()+n);return dateKey(d)};let selected=dateKey(new Date()),editing=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const days=['일','월','화','수','목','금','토'];const colors={개인:'#b8a5f2',학교:'#8ebbe9',약속:'#f3b3b8',생활:'#f4ce85',기타:'#9dd3b5'};const occurs=(t,d)=>{if(d<t.date)return false;if(t.repeat==='daily')return true;if(t.repeat==='weekly'){let a=parse(t.date),b=parse(d);return Math.round((b-a)/86400000)%7===0}return t.date===d};const doneKey=(t,d)=>`${t.id}@${d}`;function render(){const dt=parse(selected);$('heading').textContent=`${dt.getMonth()+1}월 ${dt.getDate()}일 ${days[dt.getDay()]}요일`;let monday=new Date(dt);monday.setDate(dt.getDate()-(dt.getDay()+6)%7);$('week').replaceChildren();for(let i=0;i<7;i++){let d=new Date(monday);d.setDate(monday.getDate()+i);let key=dateKey(d),b=document.createElement('button');b.className='day'+(key===selected?' active':'');b.innerHTML=`<small>${days[d.getDay()]}</small>${d.getDate()}`;b.onclick=()=>{selected=key;render()};$('week').append(b)}let items=data.tasks.filter(t=>occurs(t,selected)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('count').textContent=`${items.filter(t=>data.done[doneKey(t,selected)]).length} / ${items.length} 완료`;$('tasks').replaceChildren();if(!items.length){let e=document.createElement('div');e.className='empty';e.textContent='아직 일정이 없어요. ＋ 버튼으로 추가해 보세요!';$('tasks').append(e)}for(const t of items){let row=document.createElement('div');row.className='task'+(data.done[doneKey(t,selected)]?' done':'');row.style.borderLeftColor=colors[t.category]||colors.기타;let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!data.done[doneKey(t,selected)];cb.setAttribute('aria-label',t.title+' 완료');cb.onchange=()=>{if(cb.checked)data.done[doneKey(t,selected)]=true;else delete data.done[doneKey(t,selected)];save();render()};let time=document.createElement('div');time.className='time';time.textContent=t.time||'종일';let info=document.createElement('div');info.className='info';let name=document.createElement('div');name.className='name';name.textContent=t.title;let meta=document.createElement('div');meta.className='meta';meta.textContent=t.category+(t.repeat==='daily'?' · 매일 반복':t.repeat==='weekly'?' · 매주 반복':'');info.append(name,meta);let edit=document.createElement('button');edit.className='edit';edit.textContent='⋯';edit.setAttribute('aria-label',t.title+' 수정');edit.onclick=()=>openEditor(t);row.append(time,cb,info,edit);$('tasks').append(row)}}function openEditor(t){editing=t?.id||null;$('formtitle').textContent=t?'할 일 수정':'할 일 추가';$('title').value=t?.title||'';$('date').value=t?.date||selected;$('time').value=t?.time||'';$('category').value=t?.category||'개인';$('repeat').value=t?.repeat||'none';$('delete').hidden=!t;$('editor').showModal();$('title').focus()}$('form').onsubmit=e=>{e.preventDefault();let t={id:editing||crypto.randomUUID(),title:$('title').value.trim(),date:$('date').value,time:$('time').value,category:$('category').value,repeat:$('repeat').value};if(!t.title)return;if(editing){let i=data.tasks.findIndex(x=>x.id===editing);if(i>=0)data.tasks[i]=t}else data.tasks.push(t);selected=t.date;save();$('editor').close();render()};$('delete').onclick=()=>{if(!editing||!confirm('이 할 일을 삭제할까요? 반복 일정이라면 모든 반복이 삭제됩니다.'))return;data.tasks=data.tasks.filter(t=>t.id!==editing);for(let k of Object.keys(data.done))if(k.startsWith(editing+'@'))delete data.done[k];save();$('editor').close();render()};$('cancel').onclick=()=>$('editor').close();$('add').onclick=()=>openEditor();$('prev').onclick=()=>{selected=move(selected,-1);render()};$('next').onclick=()=>{selected=move(selected,1);render()};$('today').onclick=()=>{selected=dateKey(new Date());render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`myday-backup-${dateKey(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('backup').click();$('backup').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.tasks)||!x.done||typeof x.done!=='object')throw Error();if(!confirm('현재 데이터를 백업 파일 내용으로 교체할까요?'))return;data=x;save();render()}catch{alert('올바른 백업 파일이 아니에요.')}finally{e.target.value=''}};render();
</script></body></html>
