<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ff"><title>Builday 2.0</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#29243c;background:#f7f5ff}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}main{max-width:650px;margin:auto;padding:24px 16px 125px}.brand{color:#8176a4;font-size:14px;letter-spacing:.04em}.head{display:flex;align-items:center;justify-content:space-between;gap:6px}.head h1{font-size:clamp(19px,5.2vw,29px);white-space:nowrap;letter-spacing:-.07em;margin:10px 0 4px}.nav{display:flex;gap:5px;flex-shrink:0}.nav button,.soft{border:0;background:#ece8ff;color:#6752c2;border-radius:14px;padding:10px}.nav button{min-width:34px}.nav #today{font-size:13px}.count{font-size:13px;color:#807999;margin:8px 0 16px}.week{background:white;border-radius:22px;padding:14px 6px;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;box-shadow:0 6px 28px #44347a0a}.day{border:0;background:none;padding:9px 1px;border-radius:15px;color:#504b5c}.day small{display:block;margin-bottom:8px;font-size:12px}.day.sat{color:#3578ca}.day.sun{color:#d95066}.day.active{background:#7660d6;color:white}.day.active.sat{background:#347bd0}.day.active.sun{background:#d9546c}.section-title{font-size:20px;margin:28px 0 15px}.timeline{position:relative}.entry{display:flex;gap:12px;position:relative;min-height:88px;align-items:center}.rail{width:64px;flex-shrink:0;align-self:stretch;display:flex;flex-direction:column;align-items:center;position:relative;justify-content:center}.rail:before{content:'';position:absolute;top:0;bottom:0;width:4px;background:#e5e0ed;z-index:0}.bubble{width:54px;height:54px;border-radius:50%;background:#f0edf3;display:grid;place-items:center;font-size:25px;z-index:1;border:3px solid white}.event{flex:1;min-width:0;background:white;border-radius:20px;padding:15px 12px;display:flex;align-items:center;gap:10px;min-height:75px;box-shadow:0 5px 20px #493d6a0a;touch-action:pan-y;user-select:none;-webkit-user-select:none}.details{flex:1;min-width:0}.time{font-size:12px;color:#8d8897;margin-bottom:5px}.name{font-size:16px;font-weight:700;overflow-wrap:anywhere}.meta{font-size:12px;color:#9891a6;margin-top:5px}.check{height:27px;width:27px;flex-shrink:0;accent-color:#7660d6}.completed .name{text-decoration:line-through;color:#aaa}.gaprow{display:flex;gap:12px;min-height:47px;align-items:center;color:#928c9e;font-size:12px}.gaprail{width:64px;align-self:stretch;position:relative;display:grid;place-items:center}.gaprail:before{content:'';width:4px;height:100%;background:repeating-linear-gradient(to bottom,#e5e0ed 0 7px,transparent 7px 12px)}.gaptext{display:flex;align-items:center;gap:7px}.empty{background:white;border-radius:20px;padding:30px 15px;text-align:center;color:#928a9f}.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:0;border-radius:30px;padding:16px 29px;background:#765ed7;color:white;font-size:17px;font-weight:700;box-shadow:0 9px 26px #7660d644;z-index:4;white-space:nowrap}dialog{border:0;border-radius:24px;padding:22px 18px;width:min(94vw,470px);max-height:85vh;overflow:auto;color:#29243c;background:#fff}dialog::backdrop{background:#1f1a2d8c}dialog h2{font-size:21px;margin:0 0 16px}label{display:block;font-size:13px;color:#777185;margin:13px 0 5px}input:not([type=checkbox]):not([type=color]):not([type=file]),select,textarea{width:100%;padding:12px;border:1px solid #e5e0ed;border-radius:12px;background:#faf9ff;color:#29243c;min-width:0}textarea{resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}.primary{background:#7660d6;color:white;border:0;border-radius:12px;padding:12px 18px}.danger{background:#fff0f0;color:#cb4655;border:0;border-radius:12px;padding:10px}.iconpick,.palette{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.iconpick button{border:2px solid transparent;border-radius:12px;background:#f4f2f8;width:42px;height:42px;font-size:22px}.iconpick button.chosen{border-color:#7660d6;background:#ede7ff}.palette button{height:32px;width:32px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #ddd}.palette button.chosen{box-shadow:0 0 0 3px #7660d6}.row{display:flex;gap:8px;align-items:center}.row select{flex:1}.catitem{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.catitem span{flex:1}.catitem input[type=color]{width:42px;height:36px}.tools button{display:block;width:100%;text-align:left;margin:8px 0;padding:14px}.note{font-size:12px;color:#888097;line-height:1.5}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#302a40;color:white;padding:10px 15px;border-radius:12px;z-index:9;display:none;white-space:nowrap}#restoreFile{display:none}@media(max-width:370px){main{padding:17px 10px 110px}.head h1{font-size:18px}.nav button{padding:8px;min-width:28px}.event{padding:11px 8px}.rail,.gaprail{width:55px}.bubble{width:49px;height:49px}}
</style></head><body><main id="app"><div class="brand">Builday ✨</div><div class="head"><h1 id="heading"></h1><div class="nav"><button id="toolsBtn" aria-label="설정 및 백업">⚙</button><button id="prev" aria-label="이전 날짜">‹</button><button id="today">오늘</button><button id="next" aria-label="다음 날짜">›</button></div></div><div class="count" id="count"></div><div class="week" id="week"></div><h2 class="section-title">오늘의 타임라인</h2><div class="timeline" id="timeline"></div></main><button class="fab" id="addBtn">＋ 할 일 추가</button>
<dialog id="editor"><form id="taskForm"><h2 id="editorTitle">일정 추가</h2><label>일정 이름<input id="taskTitle" maxlength="120" required placeholder="무엇을 할까요?"></label><label>날짜<input id="taskDate" type="date" required></label><div class="twocol"><label>시작 시간<input id="startTime" type="time"></label><label>종료 시간<input id="endTime" type="time"></label></div><p class="note">시간을 비워두면 종일 일정으로 저장돼요. 시간 지정 시 시작과 종료를 모두 입력해 주세요.</p><label>카테고리</label><div class="row"><select id="taskCat"></select><button type="button" class="soft" id="editCats">관리</button></div><label>색상</label><div class="palette" id="palette"></div><label>아이콘</label><div class="iconpick" id="iconpick"></div><label>반복</label><select id="taskRepeat"><option value="none">반복 안 함</option><option value="daily">매일</option><option value="weekly">매주</option></select><label>메모<textarea id="taskNote" rows="2" placeholder="메모 (선택)"></textarea></label><div class="actions"><button type="button" class="danger" id="deleteInEditor">삭제</button><button type="button" class="soft" id="cancelEdit">취소</button><button type="submit" class="primary">저장</button></div></form></dialog>
<dialog id="toolsDialog"><h2>Builday 설정</h2><div class="tools"><button class="soft" id="backupBtn">⇩ 백업 파일 저장</button><button class="soft" id="restoreBtn">⇧ 백업 파일 불러오기</button><button class="soft" id="manageBtn">◉ 카테고리 관리</button></div><p class="note">일정은 현재 브라우저에 저장돼요. 다른 기기와 자동 동기화되지 않으니 정기적으로 백업해 주세요.</p><div class="actions"><button class="soft" id="closeTools">닫기</button></div></dialog><dialog id="catsDialog"><h2>카테고리 관리</h2><div id="catList"></div><div class="row" style="margin-top:14px"><input id="newCat" maxlength="20" placeholder="새 카테고리 이름"><input type="color" id="newCatColor" value="#9dd3b5" aria-label="새 카테고리 색상"><button class="primary" id="addCat">추가</button></div><p class="note">카테고리 삭제 시 해당 일정은 ‘기타’로 이동해요.</p><div class="actions"><button class="soft" id="closeCats">닫기</button></div></dialog><dialog id="longMenu"><h2 id="longTitle">일정</h2><div class="tools"><button class="soft" id="longEdit">✎ 일정 수정</button><button class="danger" id="longDelete">🗑 일정 삭제</button></div><div class="actions"><button class="soft" id="longCancel">취소</button></div></dialog><input type="file" id="restoreFile" accept=".json,application/json"><div class="toast" id="toast"></div>
<script>
'use strict';
const KEY='myday-planner-v1',DEFAULT_CATS={개인:'#b8a5f2',학교:'#8ebbe9',약속:'#f3b3b8',생활:'#f4ce85',기타:'#9dd3b5'},PALETTE=['#f3a1a4','#ffa57c','#f4bb4e','#a2ca84','#8ebbe9','#b8a5f2','#cf8eb7','#69b49b','#6f92c2','#f4ce85'],ICONS=['📋','🏫','🎨','📚','✏️','🛒','🍽️','☕','🚿','🧹','🧺','👕','🏠','🚶','🚇','🚗','💼','💻','📱','📞','💊','💪','🏃','🧘','🎬','🎵','🐱','🌿','🎁','💌','🛌','⭐'];
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])},move=(s,n)=>{let d=parse(s);d.setDate(d.getDate()+n);return dateKey(d)},days=['일','월','화','수','목','금','토'];
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||typeof data!=='object')data={};if(!Array.isArray(data.tasks))data.tasks=[];if(!data.done||typeof data.done!=='object')data.done={};if(!data.categories||typeof data.categories!=='object'||Array.isArray(data.categories))data.categories={...DEFAULT_CATS};if(!data.categories.기타)data.categories.기타=DEFAULT_CATS.기타;
let selected=dateKey(new Date()),editing=null,chosenColor='',chosenIcon='📋',longTask=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('저장에 실패했어요. 기기 저장 공간과 브라우저 설정을 확인해 주세요.')}}
function occurs(t,d){if(!t||!t.date||d<t.date)return false;if(t.repeat==='daily')return true;if(t.repeat==='weekly'){let a=parse(t.date),b=parse(d);return Math.round((b-a)/86400000)%7===0}return t.date===d}
function doneKey(t,d){return String(t.id)+'@'+d}function min(s){if(!/^\d\d:\d\d$/.test(s||''))return null;let a=s.split(':').map(Number);return a[0]*60+a[1]}function duration(n){return n>=60?`${Math.floor(n/60)}시간${n%60?' '+n%60+'분':''}`:`${n}분`}
function currentItems(){return data.tasks.filter(t=>occurs(t,selected)).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'))}
function render(){let dt=parse(selected);$('heading').textContent=`${dt.getMonth()+1}월 ${dt.getDate()}일 ${days[dt.getDay()]}요일`;$('week').replaceChildren();let first=new Date(dt);first.setDate(dt.getDate()-dt.getDay());for(let i=0;i<7;i++){let d=new Date(first);d.setDate(first.getDate()+i);let b=document.createElement('button');b.className='day'+(i===0?' sun':i===6?' sat':'')+(dateKey(d)===selected?' active':'');let sm=document.createElement('small');sm.textContent=days[i];b.append(sm,document.createTextNode(String(d.getDate())));b.onclick=()=>{selected=dateKey(d);render()};$('week').append(b)}let items=currentItems();$('count').textContent=`${items.filter(t=>data.done[doneKey(t,selected)]).length} / ${items.length} 완료`;$('timeline').replaceChildren();if(!items.length){let empty=document.createElement('div');empty.className='empty';empty.textContent='아직 일정이 없어요. ＋ 버튼으로 추가해 보세요!';$('timeline').append(empty);return}let previousEnd=null;for(const t of items){let start=min(t.time),end=min(t.endTime);if(start!==null&&previousEnd!==null&&start>previousEnd){let g=document.createElement('div');g.className='gaprow';let r=document.createElement('div');r.className='gaprail';let tx=document.createElement('div');tx.className='gaptext';tx.textContent='◷ 빈 시간 '+duration(start-previousEnd);g.append(r,tx);$('timeline').append(g)}let entry=document.createElement('div');entry.className='entry';let rail=document.createElement('div');rail.className='rail';let bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=t.icon||'📋';bubble.style.color=t.color||data.categories[t.category]||'#b8a5f2';rail.append(bubble);let card=document.createElement('div');card.className='event'+(data.done[doneKey(t,selected)]?' completed':'');card.style.borderLeft='4px solid '+(t.color||data.categories[t.category]||'#b8a5f2');let info=document.createElement('div');info.className='details';let time=document.createElement('div');time.className='time';time.textContent=start===null?'종일':t.time+(end!==null?' ~ '+t.endTime+' · '+duration(end-start):'');let name=document.createElement('div');name.className='name';name.textContent=t.title||'제목 없음';let meta=document.createElement('div');meta.className='meta';meta.textContent=(t.category||'기타')+(t.repeat==='daily'?' · 매일':t.repeat==='weekly'?' · 매주':'');info.append(time,name,meta);let cb=document.createElement('input');cb.type='checkbox';cb.className='check';cb.checked=!!data.done[doneKey(t,selected)];cb.setAttribute('aria-label',(t.title||'일정')+' 완료');cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{if(cb.checked)data.done[doneKey(t,selected)]=true;else delete data.done[doneKey(t,selected)];save();render()};card.append(info,cb);installGestures(card,t);entry.append(rail,card);$('timeline').append(entry);if(end!==null)previousEnd=previousEnd===null?end:Math.max(previousEnd,end);else if(start!==null)previousEnd=null}}
function installGestures(card,t){let sx=0,sy=0,timer=null,long=false,swiped=false;card.addEventListener('touchstart',e=>{if(e.target.closest('input'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;long=false;swiped=false;timer=setTimeout(()=>{long=true;navigator.vibrate?.(15);openLong(t)},550)},{passive:true});card.addEventListener('touchmove',e=>{if(!timer)return;let x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;if(Math.abs(x)>12||Math.abs(y)>12){clearTimeout(timer);timer=null}},{passive:true});card.addEventListener('touchend',e=>{if(timer)clearTimeout(timer);timer=null;let x=e.changedTouches[0].clientX-sx,y=e.changedTouches[0].clientY-sy;if(Math.abs(x)>50&&Math.abs(x)>Math.abs(y)*1.4){swiped=true}},{passive:true});card.addEventListener('contextmenu',e=>{e.preventDefault();openLong(t)});card.addEventListener('click',e=>{if(e.target.closest('input')||long||swiped){long=false;swiped=false;return}openEditor(t)})}
function populateCats(){let s=$('taskCat'),old=s.value;s.replaceChildren();for(let name of Object.keys(data.categories)){let o=document.createElement('option');o.value=name;o.textContent=name;s.append(o)}if(data.categories[old])s.value=old}
function paintChoices(){let p=$('palette');p.replaceChildren();for(let c of PALETTE){let b=document.createElement('button');b.type='button';b.style.background=c;b.className=c===chosenColor?'chosen':'';b.setAttribute('aria-label','색상 '+c);b.onclick=()=>{chosenColor=c;paintChoices()};p.append(b)}let box=$('iconpick');box.replaceChildren();for(let ic of ICONS){let b=document.createElement('button');b.type='button';b.textContent=ic;b.className=ic===chosenIcon?'chosen':'';b.onclick=()=>{chosenIcon=ic;paintChoices()};box.append(b)}}
function openEditor(t){editing=t?t.id:null;$('editorTitle').textContent=t?'일정 수정':'일정 추가';$('taskTitle').value=t?.title||'';$('taskDate').value=t?.date||selected;$('startTime').value=t?.time||'';$('endTime').value=t?.endTime||'';$('taskRepeat').value=t?.repeat||'none';$('taskNote').value=t?.note||'';populateCats();$('taskCat').value=t&&data.categories[t.category]?t.category:'개인';chosenColor=t?.color||data.categories[$('taskCat').value]||PALETTE[5];chosenIcon=t?.icon||'📋';paintChoices();$('deleteInEditor').hidden=!t;$('editor').showModal()}
$('taskCat').onchange=()=>{chosenColor=data.categories[$('taskCat').value]||PALETTE[5];paintChoices()};$('taskForm').onsubmit=e=>{e.preventDefault();let start=$('startTime').value,end=$('endTime').value;if(Boolean(start)!==Boolean(end)){alert('시작 시간과 종료 시간을 모두 입력하거나 모두 비워 주세요.');return}if(start&&min(end)<=min(start)){alert('종료 시간은 시작 시간보다 늦어야 해요.');return}let t={id:editing||('t'+Date.now()+Math.random().toString(36).slice(2)),title:$('taskTitle').value.trim(),date:$('taskDate').value,time:start,endTime:end,category:$('taskCat').value,repeat:$('taskRepeat').value,color:chosenColor,icon:chosenIcon,note:$('taskNote').value};if(!t.title)return;if(editing){let i=data.tasks.findIndex(x=>x.id===editing);if(i>=0)data.tasks[i]={...data.tasks[i],...t}}else data.tasks.push(t);selected=t.date;save();$('editor').close();render()};
function removeTask(id){if(!id||!confirm('이 일정을 삭제할까요? 반복 일정이라면 모든 반복이 삭제돼요.'))return;data.tasks=data.tasks.filter(t=>t.id!==id);for(let k of Object.keys(data.done))if(k.startsWith(id+'@'))delete data.done[k];save();$('editor').close();$('longMenu').close();render()}
function openLong(t){longTask=t;$('longTitle').textContent=t.title;$('longMenu').showModal()}$('longEdit').onclick=()=>{let t=longTask;$('longMenu').close();openEditor(t)};$('longDelete').onclick=()=>removeTask(longTask?.id);$('longCancel').onclick=()=>$('longMenu').close();$('deleteInEditor').onclick=()=>removeTask(editing);$('cancelEdit').onclick=()=>$('editor').close();$('addBtn').onclick=()=>openEditor();$('prev').onclick=()=>{selected=move(selected,-1);render()};$('next').onclick=()=>{selected=move(selected,1);render()};$('today').onclick=()=>{selected=dateKey(new Date());render()};
let gestureX=0,gestureY=0;$('app').addEventListener('touchstart',e=>{if(e.target.closest('.event,button,input,select,textarea,dialog')){gestureX=0;return}gestureX=e.touches[0].clientX;gestureY=e.touches[0].clientY},{passive:true});$('app').addEventListener('touchend',e=>{if(!gestureX)return;let dx=e.changedTouches[0].clientX-gestureX,dy=e.changedTouches[0].clientY-gestureY;gestureX=0;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5){selected=move(selected,dx<0?1:-1);render()}},{passive:true});
$('toolsBtn').onclick=()=>$('toolsDialog').showModal();$('closeTools').onclick=()=>$('toolsDialog').close();$('backupBtn').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='builday-backup-'+dateKey(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)};$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj||!Array.isArray(obj.tasks)||!obj.done||typeof obj.done!=='object')throw Error('형식');if(!confirm('현재 일정을 백업 내용으로 교체할까요? 기존 데이터는 사라질 수 있어요.'))return;data={...obj,categories:{...DEFAULT_CATS,...(obj.categories||{})}};save();render();$('toolsDialog').close()}catch(err){alert('올바른 Builday 백업 파일이 아니에요.')}finally{e.target.value=''}};
function showCats(){$('toolsDialog').close();$('editor').close();renderCats();$('catsDialog').showModal()}function renderCats(){let list=$('catList');list.replaceChildren();for(let [name,color] of Object.entries(data.categories)){let r=document.createElement('div');r.className='catitem';let input=document.createElement('input');input.type='color';input.value=/^#[0-9a-f]{6}$/i.test(color)?color:'#b8a5f2';input.onchange=()=>{data.categories[name]=input.value;save();render()};let label=document.createElement('span');label.textContent=name;r.append(input,label);if(name!=='기타'){let del=document.createElement('button');del.className='danger';del.textContent='삭제';del.onclick=()=>{if(!confirm('“'+name+'” 카테고리를 삭제할까요? 해당 일정은 기타로 이동해요.'))return;data.tasks.forEach(t=>{if(t.category===name)t.category='기타'});delete data.categories[name];save();renderCats();render()};r.append(del)}list.append(r)}}$('editCats').onclick=showCats;$('manageBtn').onclick=showCats;$('closeCats').onclick=()=>$('catsDialog').close();$('addCat').onclick=()=>{let name=$('newCat').value.trim();if(!name)return alert('이름을 입력해 주세요.');if(data.categories[name])return alert('이미 있는 카테고리예요.');data.categories[name]=$('newCatColor').value;$('newCat').value='';save();renderCats();render()};
render();
</script></body></html>
