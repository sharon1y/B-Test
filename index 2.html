const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},shiftDay=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return key(d)},days=['일','월','화','수','목','금','토'];

function choices(){const colors=$('colors');colors.replaceChildren();for(const c of PALETTE){const b=document.createElement('button');b.type='button';b.style.background=c;b.className=c===chosenColor?'chosen':'';b.setAttribute('aria-label','색상 '+c);b.onclick=()=>{chosenColor=c;choices()};colors.append(b)}const box=$('icons');box.replaceChildren();const visible=showAllIcons?ICONS:ICONS.slice(0,7);if(!visible.includes(chosenIcon))visible.push(chosenIcon);for(const i of visible){const b=document.createElement('button');b.type='button';b.textContent=i;b.className=i===chosenIcon?'chosen':'';b.onclick=()=>{chosenIcon=i;choices()};box.append(b)}$('moreIcons').textContent=showAllIcons?'접기 ▴':'전체 보기 ▾'}
function defaultStart(){const existing=list(selected).filter(t=>!t.allDay);if(existing.length){const last=[...existing].sort((a,b)=>(b.created||0)-(a.created||0))[0];return Math.min(last.end,1530)}if(selected===planningDay()){const now=new Date();let mins=now.getHours()*60+now.getMinutes();if(mins<120)mins+=1440;const next=Math.floor(mins/60+1)*60;return Math.min(next,1530)}return 9*60}
function openEditor(t=null){editing=t?t.id:null;catsSelect();$('title').value=t?.title||'';$('date').value=t?.date||selected;$('cat').value=t&&data.categories[t.category]?t.category:'개인';const s=t&&!t.allDay?t.start:defaultStart();$('start').value=clock(s);$('end').value=clock(t&&!t.allDay?t.end:s+30);$('allday').checked=!!t?.allDay;$('timeFields').classList.toggle('hidden',!!t?.allDay);$('repeat').value=t?.repeat||'none';$('note').value=t?.note||'';chosenColor=t?.color||data.categories[$('cat').value];chosenIcon=t?.icon||'📋';showAllIcons=false;choices();$('delete').classList.toggle('hidden',!t);open('editOverlay')}
$('add').onclick=()=>openEditor();$('cancel').onclick=()=>close('editOverlay');$('heading').onclick=()=>{selected=planningDay();render(true)};$('allday').onchange=()=>{$('timeFields').classList.toggle('hidden',$('allday').checked)};$('cat').onchange=()=>{chosenColor=data.categories[$('cat').value];choices()};$('moreIcons').onclick=()=>{showAllIcons=!showAllIcons;choices()};

const old=editing?data.tasks.find(t=>t.id===editing):null;const task={id:old?.id||'b'+Date.now()+Math.random().toString(36).slice(2),title,date:day,start,end,allDay,category:$('cat').value,color:chosenColor,icon:chosenIcon,repeat:$('repeat').value,note:$('note').value,alarm:old?.alarm||0,done:old?.done||{},created:old?.created||Date.now()};if(old){data.tasks[data.tasks.indexOf(old)]=task}else data.tasks.push(task);selected=day;save();close('editOverlay');render(true)};

$('settings').onclick=()=>open('settingsOverlay');$('catsBtn').onclick=()=>{close('settingsOverlay');renderCats();open('catsOverlay')};function renderCats(){const el=$('catlist');el.replaceChildren();for(const [name,color] of Object.entries(data.categories)){const row=document.createElement('div');row.className='catrow';const picker=document.createElement('input');picker.type='color';picker.value=color;picker.onchange=()=>{data.categories[name]=picker.value;save()};const label=document.createElement('span');label.className='catname';label.textContent=name;row.append(picker,label);if(name!=='기타'){const del=document.createElement('button');del.className='danger';del.textContent='삭제';del.onclick=()=>{if(!confirm('“'+name+'” 카테고리를 삭제할까요?'))return;data.tasks.forEach(t=>{if(t.category===name)t.category='기타'});delete data.categories[name];save();renderCats();render(false)};row.append(del)}el.append(row)}}$('addcat').onclick=()=>{const name=$('newcat').value.trim();if(!name)return alert('카테고리 이름을 입력해 주세요.');if(data.categories[name])return alert('이미 있는 카테고리예요.');data.categories[name]=$('newcolor').value;$('newcat').value='';save();renderCats()};
